<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flechas Básicas</title>
</head>
<body>
    <!-- Flecha Arriba -->
    <svg width="100" height="100" viewBox="0 0 100 100">
        <polygon points="50,20 30,60 70,60" fill="black"/>
    </svg>

    <!-- Flecha Abajo -->
    <svg width="100" height="100" viewBox="0 0 100 100">
        <polygon points="50,80 30,40 70,40" fill="black"/>
    </svg>

    <!-- Flecha Derecha -->
    <svg width="100" height="100" viewBox="0 0 100 100">
        <polygon points="80,50 40,30 40,70" fill="black"/>
    </svg>

    <!-- Flecha Izquierda -->
    <svg width="100" height="100" viewBox="0 0 100 100">
        <polygon points="20,50 60,30 60,70" fill="black"/>
    </svg>
</body>
</html>
