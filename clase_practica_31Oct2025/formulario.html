<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form action="/enviar_datos" method="get">
        <!-- Contenido del formulario -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre"> <br>

        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com"> <br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password"> <br>

        <input type="text" placeholder="tarjeta de credito"> <br>

        <label>Género:</label>
        <input type="radio" name="genero" value="masculino"> Masculino
        <input type="radio" name="genero" value="femenino"> Femenino

        <label>Aficiones:</label>
        <input type="checkbox" name="aficion" value="deporte"> Deporte
        <input type="checkbox" name="aficion" value="música"> Música

        <label for="pais">País:</label>
        <select id="pais" name="pais">
            <option value="mexico">México</option>
            <option value="españa">España</option>
        </select>
    </form>

    <button type="submit">Enviar</button>
    <button type="reset">Restablecer</button>

</body>

</html>
